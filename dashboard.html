    <!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #0d6efd;
      color: white;
    }

    .container {
      max-width: 680px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #0d6efd;
      margin-bottom: 25px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 16px;
    }

    label {
      font-weight: bold;
      margin-top: 12px;
      display: block;
      color: #333;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f8f9fa;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #0d6efd;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }

    .logout {
      background: #dc3545;
      width: auto;
      padding: 8px 20px;
      font-size: 14px;
    }

    .status {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
      min-height: 26px;
    }

    .book-item {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: #fafafa;
    }

    .book-item img {
      width: 60px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }

    .book-info {
      flex: 1;
    }

    .book-info strong {
      font-size: 17px;
      display: block;
      margin-bottom: 4px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    .view-btn {
      background: #28a745;
      color: white;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
    }
  </style>
</head>

<body>

<div class="top-bar">
  <h3>📚 Admin Panel</h3>
  <button class="btn logout" onclick="logout()">Logout</button>
</div>

<div class="container">
  <h2>Upload New Book</h2>

  <input type="text" id="title" placeholder="Book Title">
  <input type="text" id="category" placeholder="Category (e.g. Fiction, Technology, History)">

  <label>Cover Image (max 5 MB)</label>
  <input type="file" id="cover" accept="image/*">

  <label>PDF File (max 15 MB)</label>
  <input type="file" id="pdf" accept="application/pdf">

  <button class="btn" id="uploadBtn" onclick="uploadBook()">Upload Book</button>

  <div id="status" class="status"></div>
</div>

<div class="container">
  <h2>Manage Books</h2>
  <div id="bookList"></div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { collection, addDoc, getDocs, deleteDoc, doc, query, where } 
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

// Protect admin page
onAuthStateChanged(auth, (user) => {
  if (!user) window.location.href = "admin.html";
});

// Logout function
window.logout = function () {
  signOut(auth).then(() => {
    window.location.href = "admin.html";
  });
};

// File size limits (in bytes)
const MAX_COVER_SIZE = 5 * 1024 * 1024;   // 5 MB
const MAX_PDF_SIZE   = 15 * 1024 * 1024;  // 15 MB

// Load all books
async function loadBooks() {
  const snapshot = await getDocs(collection(db, "books"));
  const container = document.getElementById("bookList");
  container.innerHTML = "";

  if (snapshot.empty) {
    container.innerHTML = `<p style="text-align:center; color:#666; padding:20px;">No books uploaded yet.</p>`;
    return;
  }

  snapshot.forEach((d) => {
    const book = d.data();
    container.innerHTML += `
      <div class="book-item">
        <img src="${book.coverUrl}" alt="${book.title} cover">
        <div class="book-info">
          <strong>${book.title}</strong>
          <small style="color:#555;">${book.category || 'Uncategorized'}</small>
        </div>
        <div class="actions">
          <a href="${book.pdfUrl}" target="_blank" style="text-decoration:none;">
            <button class="view-btn">📖 View PDF</button>
          </a>
          <button class="delete-btn" onclick="deleteBook('${d.id}')">Delete</button>
        </div>
      </div>
    `;
  });
}

// Delete book
window.deleteBook = async function (id) {
  if (!confirm("Delete this book permanently?")) return;

  try {
    await deleteDoc(doc(db, "books", id));
    alert("Book deleted successfully!");
    loadBooks();
  } catch (err) {
    console.error(err);
    alert("Failed to delete book");
  }
};

function showStatus(message, color = "#0d6efd") {
  const status = document.getElementById("status");
  status.style.color = color;
  status.innerHTML = message;
}

function resetButton() {
  const uploadBtn = document.getElementById("uploadBtn");
  uploadBtn.disabled = false;
  uploadBtn.innerText = "Upload Book";
}

// Main upload function
window.uploadBook = async function () {
  const title = document.getElementById("title").value.trim();
  const category = document.getElementById("category").value.trim();
  const coverFile = document.getElementById("cover").files[0];
  const pdfFile = document.getElementById("pdf").files[0];
  const status = document.getElementById("status");
  const uploadBtn = document.getElementById("uploadBtn");

  if (!title || !category || !coverFile || !pdfFile) {
    showStatus("⚠️ Please fill all fields and select both files", "red");
    return;
  }

  // === File size validation ===
  if (coverFile.size > MAX_COVER_SIZE) {
    const sizeMB = (coverFile.size / (1024 * 1024)).toFixed(2);
    showStatus(`❌ Cover image too large.<br>Got ${sizeMB} MB. Maximum is 5 MB.`, "red");
    return;
  }

  if (pdfFile.size > MAX_PDF_SIZE) {
    const sizeMB = (pdfFile.size / (1024 * 1024)).toFixed(2);
    showStatus(`❌ PDF file too large.<br>Got ${sizeMB} MB. Maximum is 15 MB.`, "red");
    return;
  }

  // Disable button
  uploadBtn.disabled = true;
  uploadBtn.innerText = "Uploading...";

  try {
    // Check duplicate title
    showStatus("Checking for duplicate title...");
    const q = query(collection(db, "books"), where("title", "==", title));
    const existing = await getDocs(q);

    if (!existing.empty) {
      showStatus("⚠️ Book with this title already exists!", "orange");
      resetButton();
      return;
    }

    showStatus("Uploading cover image to Cloudinary...");

    // Upload Cover
    const coverForm = new FormData();
    coverForm.append("file", coverFile);
    coverForm.append("upload_preset", "library_upload");

    const coverRes = await fetch("https://api.cloudinary.com/v1_1/dxasunfat/image/upload", {
      method: "POST",
      body: coverForm
    });
    const coverData = await coverRes.json();

    if (coverData.error) throw new Error(coverData.error.message || "Cover upload failed");

    showStatus("Uploading PDF to Cloudinary...");

    // Upload PDF
    const pdfForm = new FormData();
    pdfForm.append("file", pdfFile);
    pdfForm.append("upload_preset", "library_upload");

    const pdfRes = await fetch("https://api.cloudinary.com/v1_1/dxasunfat/image/upload", {
      method: "POST",
      body: pdfForm
    });
    const pdfData = await pdfRes.json();

    if (pdfData.error) throw new Error(pdfData.error.message || "PDF upload failed");

    showStatus("Saving book information...");

    // Save to Firestore
    await addDoc(collection(db, "books"), {
      title: title,
      category: category,
      coverUrl: coverData.secure_url,
      pdfUrl: pdfData.secure_url,
      createdAt: new Date().toISOString()
    });

    showStatus("✅ Book uploaded successfully!", "green");

    // Clear form
    document.getElementById("title").value = "";
    document.getElementById("category").value = "";
    document.getElementById("cover").value = "";
    document.getElementById("pdf").value = "";

    loadBooks();

  } catch (error) {
    console.error(error);
    showStatus("❌ Upload failed: " + (error.message || "Please try again"), "red");
  } finally {
    resetButton();
  }
};

// Load books on page load
loadBooks();
</script>

</body>
</html>
