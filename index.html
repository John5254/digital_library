<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JB Digi-Lib</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --text: #1f2937;
      --bg: #f8fafc;
    }

    [data-theme="dark"] {
      --text: #e2e8f0;
      --bg: #0f172a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: all 0.4s;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ==================== HEADER ==================== */
    .header {
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 15px rgba(0,0,0,0.08);
    }

    [data-theme="dark"] .header {
      background: rgba(15, 23, 42, 0.97);
      border-bottom: 1px solid #334155;
    }

    .header-content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      display: flex;
      flex-direction: column;
      text-decoration: none;
    }

    .logo-name {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .logo-tagline {
      font-size: 13.5px;
      color: #64748b;
      font-weight: 500;
      margin-top: 2px;
    }

    .search-container {
      position: relative;
      flex: 1;
      max-width: 520px;
    }

    .search-box {
      width: 100%;
      padding: 14px 20px 14px 50px;
      border: 2px solid #e2e8f0;
      border-radius: 50px;
      font-size: 16px;
      background: white;
    }

    [data-theme="dark"] .search-box {
      background: #1e2937;
      border-color: #475569;
      color: #e2e8f0;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 18px;
    }

    /* ==================== MAIN ==================== */
    .container {
      max-width: 1280px;
      margin: 25px auto;
      padding: 0 20px;
      flex: 1;
    }

    .filter-chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .chip {
      padding: 8px 18px;
      background: #f1f5f9;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    [data-theme="dark"] .chip {
      background: #334155;
    }

    .chip.active {
      background: var(--primary);
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
    }

    [data-theme="dark"] .card {
      background: #1e2937;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.12);
    }

    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #e2e8f0;
    }

    .card-content {
      padding: 14px;
    }

    .title {
      font-size: 15.5px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .category {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      text-align: center;
      font-size: 14px;
      transition: all 0.3s;
    }

    .read { background: var(--primary); color: white; }
    .read:hover { background: var(--primary-dark); }

    .download { background: #22c55e; color: white; }
    .download:hover { background: #16a34a; }

    .empty, .loading {
      text-align: center;
      margin-top: 60px;
      color: #666;
      font-size: 17px;
      grid-column: 1 / -1;
    }

    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ==================== FOOTER ==================== */
    .footer {
      background: #1e2937;
      color: #e2e8f0;
      text-align: center;
      padding: 2.5rem 1.5rem;
      margin-top: 40px;
      font-size: 0.95rem;
    }

    [data-theme="dark"] .footer {
      background: #0f172a;
      border-top: 1px solid #334155;
    }

    .footer-content {
      max-width: 700px;
      margin: 0 auto;
    }

    .footer-brand {
      font-size: 1.4rem;
      font-weight: 700;
      color: #818cf8;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .footer-tagline {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 1.8rem;
      font-style: italic;
    }

    .footer-contact {
      margin-bottom: 1.8rem;
      line-height: 1.8;
    }

    .footer-contact p {
      margin: 0.6rem 0;
    }

    .footer-contact a {
      color: #7dd3fc;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-contact a:hover {
      color: #38bdf8;
      text-decoration: underline;
    }

    .footer-contact i {
      width: 20px;
      margin-right: 6px;
      color: #818cf8;
    }

    .footer-copy {
      font-size: 0.85rem;
      color: #94a3b8;
      margin: 0;
      opacity: 0.85;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header-content {
        padding: 16px 15px;
        flex-direction: column;
        align-items: flex-start;
      }
      
      .logo-name {
        font-size: 25px;
        letter-spacing: 2px;
      }
      
      .search-container {
        max-width: 100%;
        margin-top: 8px;
      }
    }
  </style>
</head>

  <script type="module">
    import { db } from "./firebase.js";
    import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const booksContainer = document.getElementById("books");
    const emptyEl = document.getElementById("empty");
    const searchInput = document.getElementById("search");
    const filterChips = document.getElementById("filter-chips");

    let allBooks = [];
    let currentCategoryFilter = "All";

    // Show Loading
    function showLoading() {
      booksContainer.innerHTML = `
        <div class="loading">
          <div class="spinner"></div><br>
          Loading books...
        </div>
      `;
    }

    // Create Category Filter Chips
    function createFilterChips(categories) {
      filterChips.innerHTML = `<div class="chip active" data-category="All">All Books</div>`;
      
      categories.forEach(cat => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.textContent = cat;
        chip.dataset.category = cat;
        filterChips.appendChild(chip);
      });

      filterChips.addEventListener("click", (e) => {
        if (e.target.classList.contains("chip")) {
          document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
          e.target.classList.add("active");
          currentCategoryFilter = e.target.dataset.category;
          filterBooks();
        }
      });
    }

    // Load Books
    async function loadBooks() {
      showLoading();

      try {
        const q = query(collection(db, "books"), orderBy("title"));
        const snapshot = await getDocs(q);

        allBooks = [];
        snapshot.forEach(doc => {
          allBooks.push({ id: doc.id, ...doc.data() });
        });

        if (allBooks.length === 0) {
          emptyEl.innerHTML = `<p>No books available yet.<br>Check back later!</p>`;
          booksContainer.innerHTML = "";
          return;
        }

        const categories = [...new Set(allBooks.map(b => b.category).filter(Boolean))];
        createFilterChips(categories);
        displayBooks(allBooks);
      } catch (error) {
        console.error("Error loading books:", error);
        emptyEl.innerHTML = `<p style="color:red;">❌ Failed to load books.</p>
